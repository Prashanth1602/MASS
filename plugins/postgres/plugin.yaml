name: postgres
version: "1.0"

type: container

image:
  repository: postgres
  tag: "18"

provides:
  - database

configuration:
  database:
    type: string
    required: true
    default: app

  username:
    type: string
    required: true
    default: app

  password:
    type: string
    required: true
    secret: true

  port:
    type: integer
    required: false
    default: 5432

environment:
  POSTGRES_DB: "{{ database }}"
  POSTGRES_USER: "{{ username }}"
  POSTGRES_PASSWORD: "{{ password }}"

volumes:
  - name: postgres_data
    target: /var/lib/postgresql/data