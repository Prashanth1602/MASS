[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mass-app-stack"
version = "0.1.0"
description = "MASS — Modular App Service Stack"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "PyYAML",
]

[project.scripts]
mass = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]
